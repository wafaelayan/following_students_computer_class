  #examBoard{ position:fixed; inset:0; z-index:99990; display:none; direction:rtl; color:#4A2C6B; overflow:hidden;
    background:radial-gradient(circle at 10% 15%, rgba(236,206,214,.55) 0%, transparent 40%), radial-gradient(circle at 90% 20%, rgba(206,220,236,.5) 0%, transparent 38%), radial-gradient(circle at 85% 90%, rgba(208,228,216,.5) 0%, transparent 40%), linear-gradient(135deg,#FBF6EC 0%,#F6F0F3 52%,#F0F3EE 100%); font-family:'Tajawal',sans-serif; }
  #examBoard.open{ display:flex; flex-direction:column; }
  #examBoard .eb-cv{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:4; }
  #examBoard .eb-clock{ justify-self:end; display:flex; align-items:center; gap:1vw; direction:ltr; cursor:pointer; margin-top:.4vh; }
  #examBoard .eb-clock svg{ height:11.5vh; width:11.5vh; filter:drop-shadow(0 5px 10px rgba(150,100,180,.3)); animation:ebSway 6s ease-in-out infinite; }
  #examBoard .eb-dig{ text-align:center; font-family:'EBAref','Tajawal',serif; direction:rtl; background:rgba(255,255,255,.7); border:2px solid #E6D3A4; border-radius:2vh; padding:.6vh 1.1vw .3vh; box-shadow:0 4px 12px rgba(150,110,160,.2); }
  #examBoard .eb-hm{ display:flex; justify-content:center; font-size:6.2vh; font-weight:700; line-height:1.1; direction:ltr; background:linear-gradient(90deg,#6F4B8B,#A8527E,#C08A58,#6F4B8B); background-size:200% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; animation:ebShine 5s linear infinite; }
  #examBoard .eb-hm i{ font-style:normal; display:inline-block; animation:ebBlink 1s steps(2,start) infinite; padding:0 .2vw; }
  #examBoard .eb-ss{ font-size:3.2vh; color:#8F70A0; font-weight:700; line-height:1.3; }
  #examBoard .eb-hm span{ unicode-bidi:isolate; direction:ltr; }
  #examBoard .eb-row{ display:flex; direction:ltr; align-items:flex-end; justify-content:center; gap:.5vw; }
  #examBoard .eb-s2{ font-size:3.4vh; font-weight:700; color:#C08A58; line-height:1.9; unicode-bidi:isolate; min-width:2.2ch; text-align:left; }
  @keyframes ebBlink{ 50%{ opacity:.15 } }
  @keyframes ebSway{ 0%,100%{ transform:rotate(-3deg) } 50%{ transform:rotate(3deg) } }
  @keyframes ebShine{ to{ background-position:-200% 0 } }
  @keyframes ebFloat{ 0%,100%{ transform:translateY(0) rotate(-.4deg) } 50%{ transform:translateY(-1.1vh) rotate(.4deg) } }
  @keyframes ebPop{ 0%{ transform:scale(.3); opacity:0 } 60%{ transform:scale(1.18) } 100%{ transform:scale(1); opacity:1 } }
  @keyframes ebBump{ 0%{ transform:scale(1) } 30%{ transform:scale(1.14) rotate(-3deg) } 60%{ transform:scale(.96) rotate(2deg) } 100%{ transform:scale(1) } }
  @keyframes ebBob{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-1.6vh) } }
  @keyframes ebGlowPulse{ 0%,100%{ box-shadow:0 5px 14px rgba(120,90,140,.28) } 50%{ box-shadow:0 5px 26px rgba(190,110,160,.55) } }
  @keyframes ebSpin{ to{ transform:rotate(360deg) } }
  #examBoard .bump{ animation:ebBump .7s ease !important; }
  #examBoard .eb-ctrl{ position:absolute; bottom:1.8vh; left:2.4vw; display:flex; gap:8px; z-index:6; opacity:.3; transition:opacity .25s; }
  #examBoard .eb-ctrl:hover{ opacity:1; }
  #examBoard .eb-ctrl button{ border:0; border-radius:10px; padding:8px 14px; font-family:inherit; font-weight:700; font-size:14px; cursor:pointer; background:#fff; color:#7A4E9A; box-shadow:0 2px 8px rgba(120,80,160,.25); }
  #examBoard .eb-star{ position:absolute; opacity:.5; animation:ebTw 3.4s ease-in-out infinite; pointer-events:none; }
  @keyframes ebTw{ 0%,100%{ transform:scale(.75) rotate(0); opacity:.35 } 50%{ transform:scale(1.2) rotate(12deg); opacity:.95 } }
  #examBoard .eb-head{ display:grid; grid-template-columns:1fr auto 1fr; align-items:start; padding:2.4vh 4vw 0; position:relative; z-index:2; }
  #examBoard .eb-min{ text-align:right; font-family:'EBAref','Tajawal',serif; font-weight:700; color:#6C4F7F; line-height:1.55; }
  #examBoard .eb-min div:first-child{ font-size:4.6vh; }
  #examBoard .eb-min div:last-child{ font-size:3.9vh; color:#8F70A0; }
  #examBoard .eb-mid{ text-align:center; }
  #examBoard .eb-mid img{ height:9.5vh; width:auto; background:#fff; border-radius:50%; padding:5px; box-shadow:0 6px 20px rgba(150,100,180,.3); animation:ebFloat 5s ease-in-out infinite; }
  #examBoard .eb-school{ font-family:'EBAref','Tajawal',serif; font-size:3.4vh; font-weight:700; color:#6C4F7F; margin-top:.2vh; line-height:1.3; }
  #examBoard .eb-title{ position:relative; z-index:2; font-family:'EBLalezar','Reem Kufi',serif; font-weight:400; font-size:6.8vh; line-height:1.35; margin:1vh 0 0; text-align:center; background:linear-gradient(90deg,#6F4B8B,#A8527E,#C08A58,#A8527E,#6F4B8B); background-size:200% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 2px 3px rgba(255,250,240,.95)); animation:ebShine 7s linear infinite; }
  #examBoard .eb-sub{ position:relative; z-index:2; font-family:'EBAref','Tajawal',serif; font-size:4.2vh; font-weight:700; color:#5A4270; margin-top:0; line-height:1.4; text-align:center; }
  #examBoard .eb-frame{ position:absolute; inset:1.4vh 1vw; border:2px solid #CDB27A; border-radius:3vh; pointer-events:none; box-shadow:inset 0 0 0 .8vh rgba(255,252,244,.7), inset 0 0 0 calc(.8vh + 1.5px) rgba(205,178,122,.6); animation:ebFrame 4s ease-in-out infinite; }
  @keyframes ebFrame{ 0%,100%{ border-color:#CDB27A } 50%{ border-color:#E7A9C4 } }
  #examBoard .eb-date{ position:relative; z-index:2; display:flex; align-items:center; justify-content:center; gap:1.6vw; margin-top:.8vh; }
  #examBoard .eb-date span{ font-family:'EBAref','Tajawal',serif; font-size:4.4vh; font-weight:700; color:#fff; background:linear-gradient(90deg,#86689F,#B07E9E,#86689F); background-size:200% 100%; padding:.3vh 3vw; border-radius:99px; border:2.5px solid #F8F1E2; outline:1.5px solid #CDB27A; outline-offset:2px; animation:ebShine 6s linear infinite, ebGlowPulse 3s ease-in-out infinite; }
  #examBoard .eb-date em, #examBoard .eb-orn em{ display:block; height:2px; width:11vw; background:linear-gradient(90deg,transparent,#CDB27A); border-radius:2px; }
  #examBoard .eb-date em:last-child, #examBoard .eb-orn em:last-child{ background:linear-gradient(270deg,transparent,#CDB27A); }
  #examBoard .eb-orn{ position:relative; z-index:2; display:flex; align-items:center; justify-content:center; gap:1.2vw; color:#CDB27A; font-size:2.6vh; margin-top:.8vh; }
  #examBoard .eb-orn b{ display:inline-block; animation:ebSpin 6s linear infinite; font-weight:400; }
  #examBoard .eb-orn b:nth-of-type(2){ animation-direction:reverse; color:#E3A9C0; }
  #examBoard .eb-cards{ position:relative; z-index:2; display:flex; justify-content:center; gap:1.6vw; padding:2.8vh 5vw 0; flex-wrap:nowrap; }
  #examBoard .eb-card{ flex:1 1 0; max-width:22vw; border-radius:2.6vh; padding:1.1vh .8vw 1.2vh; text-align:center; box-shadow:0 8px 22px rgba(120,100,130,.2), inset 0 2px 0 rgba(255,255,255,.9); border:2px solid #FBF5E6; outline:1px solid #D8C08A; outline-offset:-5px; position:relative; overflow:hidden; cursor:pointer; animation:ebFloat 4.6s ease-in-out infinite; }
  #examBoard .eb-card.c2{ animation-delay:-1.1s } #examBoard .eb-card.c3{ animation-delay:-2.2s } #examBoard .eb-card.c4{ animation-delay:-3.3s }
  #examBoard .eb-card::before{ content:''; position:absolute; top:0; right:0; left:0; height:.9vh; background:rgba(255,255,255,.65); }
  #examBoard .eb-card::after{ content:''; position:absolute; top:0; bottom:0; width:30%; left:-40%; background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent); transform:skewX(-18deg); animation:ebSweep 6s ease-in-out infinite; }
  #examBoard .eb-card.c2::after{ animation-delay:1.5s } #examBoard .eb-card.c3::after{ animation-delay:3s } #examBoard .eb-card.c4::after{ animation-delay:4.5s }
  @keyframes ebSweep{ 0%{ left:-40% } 35%,100%{ left:140% } }
  #examBoard .eb-card small{ display:block; font-family:'EBAref','Tajawal',serif; font-size:4vh; font-weight:700; background:linear-gradient(90deg,#5F3E80,#9C4572,#AD7440,#5F3E80); -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent; }
  #examBoard .eb-card b{ display:block; font-size:9vh; line-height:1.05; margin-top:.2vh; font-family:'EBAref','Tajawal',serif; background:linear-gradient(90deg,#5F3E80,#9C4572,#AD7440,#5F3E80); -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent; animation:ebPop .8s cubic-bezier(.3,1.5,.5,1) both; }
  #examBoard .eb-card.c1{ background:linear-gradient(135deg,#F6DECF,#F7EBCB); }
  #examBoard .eb-card.c2{ background:linear-gradient(135deg,#D3EADC,#E5F0D5); }
  #examBoard .eb-card.c3{ background:linear-gradient(135deg,#D6E5F2,#E0E3F4); }
  #examBoard .eb-card.c4{ background:linear-gradient(135deg,#F4D6E0,#F8E4ED); }
  #examBoard .eb-card.c5{ background:linear-gradient(135deg,#E3D3FF,#F2DCFF); }
  #examBoard .eb-card b.sm{ font-size:4.6vh; padding-top:.4vh; line-height:1.25; font-family:'EBAref','Tajawal',serif; }
  #examBoard .eb-wish{ position:relative; z-index:2; flex:1; min-height:13vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:0 3vw; gap:2vw; }
  #examBoard .eb-wish .eb-ph{ font-family:'EBWish','EBAref',serif; font-weight:700; font-size:8.6vh; line-height:1.6; color:#A94A74; text-shadow:0 0 12px rgba(255,252,244,.95), 0 3px 0 rgba(255,252,244,.9), 0 7px 14px rgba(150,70,110,.2); }
  #examBoard .eb-wish .eb-ph u{ display:inline-block; text-decoration:none; animation:ebBob 2.8s ease-in-out infinite; }
  #examBoard .eb-abs{ position:relative; z-index:2; padding:0 5vw 4.2vh; text-align:center; min-height:8vh; }
  #examBoard .eb-abs h4{ margin:0 0 .8vh; font-family:'EBAref','Tajawal',serif; font-size:3.8vh; color:#9E4668; }
  #examBoard .eb-chips{ display:flex; flex-wrap:wrap; justify-content:center; gap:1vh 1vw; }
  #examBoard .eb-chips span{ white-space:nowrap; background:#fff; border:2px solid #E6CBD4; border-radius:99px; padding:.7vh 1.6vw .3vh; line-height:1.55; font-family:'EBAref','Tajawal',serif; font-size:3.3vh; font-weight:700; color:#5A4270; box-shadow:0 3px 8px rgba(150,110,130,.15); animation:ebFloat 4s ease-in-out infinite; }
  #examBoard .eb-credit{ position:absolute; bottom:1.8vh; right:3vw; z-index:3; font-size:2.3vh; line-height:1.5; text-align:center; width:20vw; color:#9B6BB5; font-family:'EBAref',serif; }

  #examBoard .eb-cw{ justify-self:end; display:flex; flex-direction:column; align-items:center; gap:.7vh; }
  #examBoard .eb-cw .eb-clock{ margin-top:.4vh; }
  #examBoard .eb-cw .eb-clock svg{ height:10vh; width:10vh; }
  #examBoard .eb-per{ font-family:'EBAref','Tajawal',serif; font-weight:700; font-size:3.6vh; line-height:1.5; color:#fff; padding:.1vh 2vw 0; border-radius:99px; background:linear-gradient(90deg,#86689F,#B07E9E,#86689F); background-size:200% 100%; border:2px solid #F8F1E2; outline:1.5px solid #CDB27A; outline-offset:2px; animation:ebShine 6s linear infinite, ebGlowPulse 3s ease-in-out infinite; white-space:nowrap; }
  html,body{ margin:0; height:100%; background:#FBF6EC; }
  #examBoard .eb-cw .eb-clock svg{ height:8.8vh; width:8.8vh; }
  #examBoard .eb-per{ font-size:3.2vh; line-height:1.4; }
  #examBoard .eb-cw .eb-hm{ font-size:5.2vh; }
  #examBoard .eb-cards{ padding-top:1.6vh; }
  #examBoard .eb-wish{ min-height:9vh; }
  #examBoard .eb-wish .eb-ph{ font-size:7.8vh; line-height:1.4; }
  #examBoard .eb-abs{ padding-bottom:3.4vh; min-height:6vh; }

  .eb-pick{ position:fixed; inset:0; z-index:99999; background:rgba(60,40,80,.45); display:flex; align-items:center; justify-content:center; font-family:'Tajawal',sans-serif; direction:rtl; }
  .eb-pick > div{ background:#fff; border-radius:18px; padding:24px 28px; width:min(420px,90vw); display:flex; flex-direction:column; gap:10px; box-shadow:0 12px 40px rgba(0,0,0,.3); }
  .eb-pick h3{ margin:0 0 4px; color:#6F4B8B; }
  .eb-pick select, .eb-pick button{ font-family:inherit; font-size:16px; padding:10px; border-radius:10px; border:1.5px solid #D9C9E6; }
  .eb-pick button{ cursor:pointer; background:#8B64A8; color:#fff; border:0; font-weight:700; }
  .eb-pick button#pkFollow{ background:#B8956A; } .eb-pick button#pkX{ background:#eee; color:#555; }
  .eb-pick small{ color:#888; }

  #ebAlert{ position:absolute; left:50%; top:46%; transform:translate(-50%,-50%) scale(.6); z-index:8; opacity:0; pointer-events:none; font-family:'EBLalezar','EBAref',serif; font-size:6.6vh; padding:2.2vh 4vw; border-radius:4vh; color:#fff; border:4px solid #F8F1E2; box-shadow:0 16px 50px rgba(120,60,120,.5); transition:all .4s cubic-bezier(.3,1.5,.5,1); text-align:center; white-space:nowrap; }
  #ebAlert.show{ opacity:1; transform:translate(-50%,-50%) scale(1); }
  #ebAlert.warn{ background:linear-gradient(135deg,#E0903C,#D4604E); animation:ebBlinkMsg 2.4s ease-in-out infinite; }
  #ebAlert.end{ background:linear-gradient(135deg,#C83A5E,#8E2E7A); animation:ebBlinkMsg 2.4s ease-in-out infinite; }
  @keyframes ebBlinkMsg{ 0%,100%{ opacity:1; filter:brightness(1.12) } 50%{ opacity:.3; filter:brightness(.92) } }
  #ebFlash{ position:absolute; inset:0; z-index:7; pointer-events:none; opacity:0; }
  #ebFlash.show.warn{ animation:ebFlashW 2.4s ease-in-out infinite; } #ebFlash.show.end{ animation:ebFlashE 2.4s ease-in-out infinite; }
  @keyframes ebFlashW{ 0%,100%{ box-shadow:inset 0 0 0 1.6vh rgba(224,144,60,.75), inset 0 0 12vh rgba(224,144,60,.5); } 50%{ box-shadow:inset 0 0 0 0 rgba(224,144,60,0), inset 0 0 0 rgba(224,144,60,0); } }
  @keyframes ebFlashE{ 0%,100%{ box-shadow:inset 0 0 0 1.6vh rgba(200,58,94,.8), inset 0 0 14vh rgba(200,58,94,.55); } 50%{ box-shadow:inset 0 0 0 0 rgba(200,58,94,0), inset 0 0 0 rgba(200,58,94,0); } }

  const set = (id, d) => { const e = document.getElementById(id); if(e) e.setAttribute('transform', `rotate(${d} 50 50)`); };
  set('ebH', hr * 30); set('ebM', mn * 6); set('ebS', sc * 6);

function ebCountUp(){

}
const P = 'moudi_cloud_v3_';
const escHtml = x => String(x == null ? '' : x).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function formatThreePartName(n){ const p = String(n || '').trim().split(/\s+/); return p.length > 3 ? [p[0], p[1], p[p.length - 1]].join(' ') : p.join(' '); }

let ctx = null, students = [], recs = {}, subKey = '', subRefs = [];

function ebSubscribe(){

// ===== تنبيه: جرس + رسالة وامضة قبل نهاية الاختبار بـ 5 دقائق، وجرس + «نهاية الاختبار» عند النهاية =====
const STARTS = [475, 525, 575, 635, 685, 745, 790];

let soundOn = localStorage.getItem('eb_sound') === '1', actx = null;
db.ref(P + 'lesson_duration').on('value', sn => { const v = parseInt(sn.val(), 10); if(v > 0){ DUR = v; localStorage.setItem('eb_dur', v); } });
function ebAudio(){ try{ actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if(actx.state === 'suspended') actx.resume(); }catch(e){} return actx; }
function ebBell(times){
  const a = ebAudio(); if(!a) return;
  for(let i = 0; i < times; i++){
    const t0 = a.currentTime + i * 1.4;
    [[880, .4], [1320, .22], [1760, .12], [2640, .06]].forEach(([f, v]) => {
      const o = a.createOscillator(), g = a.createGain();
      o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(v, t0 + .01); g.gain.exponentialRampToValueAtTime(.001, t0 + 1.3);
      o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + 1.4);
    });
  }
}
function ebBanner(txt, kind, secs){
  const el = document.getElementById('examBoard');
  let b = document.getElementById('ebAlert'); if(!b){ b = document.createElement('div'); b.id = 'ebAlert'; el.appendChild(b); }
  let f = document.getElementById('ebFlash'); if(!f){ f = document.createElement('div'); f.id = 'ebFlash'; el.appendChild(f); }

  clearTimeout(b._t); b._t = setTimeout(ebHideAlert, secs * 1000);
}
function ebHideAlert(){ const b = document.getElementById('ebAlert'), f = document.getElementById('ebFlash'); if(b){ clearTimeout(b._t); b.className = ''; } if(f) f.className = ''; alertKind = ''; }
function ebFire(kind){
  if(kind === 'warn'){ ebBanner('تنبيه: تبقّى خمس دقائق على نهاية الاختبار', 'warn', 3600); if(soundOn) ebBell(2); }
  else { ebBanner('نهاية الاختبار', 'end', 30); if(soundOn) ebBell(3); }
}
function ebPeriodIdx(){
  if(!ctx) return -1;
  if(ctx.pinned){ const m = /(\d)/.exec(ctx.pper || ''); return m ? parseInt(m[1], 10) - 1 : -1; }

}
function ebAlarmTick(){

  const k = todayStr() + '_' + i + '_' + (ctx.sec || '');

  else if(left <= 0 && left > -60){ if(alertKind === 'warn') ebHideAlert(); if(!fired['e' + k]){ fired['e' + k] = 1; fired['w' + k] = 1; ebFire('end'); } }

}
setInterval(ebAlarmTick, 1000);
